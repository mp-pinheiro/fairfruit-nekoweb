name: Transfer Nekoweb deployment secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt deployment secrets
        env:
          NEKOWEB_API_KEY: ${{ secrets.NEKOWEB_API_KEY }}
          NEKOWEB_ENCRYPTION_KEY: ${{ secrets.NEKOWEB_ENCRYPTION_KEY }}
          TRANSFER_PUBLIC_KEY: 
        run: |
          node --input-type=module <<'JS'
          import { randomBytes, createCipheriv, publicEncrypt } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const values = Object.fromEntries(['NEKOWEB_API_KEY', 'NEKOWEB_ENCRYPTION_KEY'].map(name => {
            const value = process.env[name];
            if (!value) throw new Error(name + ' is unavailable');
            return [name, value];
          }));
          const key = randomBytes(32);
          const iv = randomBytes(12);
          const cipher = createCipheriv('aes-256-gcm', key, iv);
          const encrypted = Buffer.concat([cipher.update(JSON.stringify(values), 'utf8'), cipher.final()]);
          const wrappedKey = publicEncrypt({ key: Buffer.from(process.env.TRANSFER_PUBLIC_KEY, 'base64'), oaepHash: 'sha256' }, key);
          writeFileSync('deployment-secrets.encrypted.json', JSON.stringify({ wrappedKey: wrappedKey.toString('base64'), iv: iv.toString('base64'), tag: cipher.getAuthTag().toString('base64'), encrypted: encrypted.toString('base64') }));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-secrets-encrypted
          path: deployment-secrets.encrypted.json
          retention-days: 1

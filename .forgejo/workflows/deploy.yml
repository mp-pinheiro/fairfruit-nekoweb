name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Check Svelte
        run: bun run check
      - name: Build
        run: bun run build
      - name: Publish Pages branch
        run: |
          git config user.name "fairfruit"
          git config user.email "17935077+mp-pinheiro@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/pages-index"
          git -C build --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=. add --all
          tree="$(git write-tree)"
          commit="$(printf 'chore(pages): deploy %s\n' "$GITHUB_SHA" | git commit-tree "$tree")"
          git push origin "+$commit:refs/heads/gh-pages"
      - name: Deploy to Nekoweb
        env:
          NEKOWEB_API_KEY: ${{ secrets.NEKOWEB_API_KEY }}
          NEKOWEB_ENCRYPTION_KEY: ${{ secrets.NEKOWEB_ENCRYPTION_KEY }}
        run: |
          git clone https://github.com/mp-pinheiro/nekoweb-deploy.git "$RUNNER_TEMP/nekoweb-deploy"
          git -C "$RUNNER_TEMP/nekoweb-deploy" checkout 0.3.1
          python3 -m venv --without-pip "$RUNNER_TEMP/nekoweb-venv"
          python3 -m pip --python "$RUNNER_TEMP/nekoweb-venv" install -r "$RUNNER_TEMP/nekoweb-deploy/requirements.txt"
          "$RUNNER_TEMP/nekoweb-venv/bin/python" "$RUNNER_TEMP/nekoweb-deploy/deploy.py" \
            "$NEKOWEB_API_KEY" ./build /fairfruit.nekoweb.org True fairfruit \
            --encryption-key "$NEKOWEB_ENCRYPTION_KEY"
